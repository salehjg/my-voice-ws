# myvoice: offline Italian <-> English speech translator.
#
# Relative paths are resolved against the directory containing this file.
# Any value can be overridden on the command line, e.g.
#   ./myvoice.py --set asr.compute_type=int8_float16 --set general.direction=it-en
# Choices you make inside the app (voices, on/off toggles) are saved to config.local.toml,
# which overrides this file. Delete config.local.toml to go back to these defaults.

[general]
# Translation direction (auto mode, `file`, `text`):
# "auto"  : detect Italian/English per sentence and translate into the other one
# "it-en" : always Italian -> English (skips language detection)
# "en-it" : always English -> Italian
direction = "auto"
languages = ["it", "en"]        # the language pair (first is the "home" language)
session_log_dir = "outputs"     # one JSONL transcript per conversation; "" disables it
warmup = true                   # run one dummy pass at start-up so the first utterance is fast

[talk]
# The conversation app (`./myvoice.py`). Auto mode translates every sentence it hears; manual mode
# (`-m`): they speak their language, you answer in yours.
their_language = "it"
my_language = "en"
speak_to_me = true              # also speak translations into your language, not only show them (key A toggles)
confirm_my_speech = true        # manual mode: show what was heard from you, wait for Enter before translating (key C)
their_end_silence_ms = 1000     # manual mode: this much silence ends their turn
my_end_silence_ms = 1500        # ...and yours (longer, so thinking pauses don't cut you off)
auto_end_silence_ms = 1000      # auto mode: this much silence ends a sentence
no_speech_timeout_s = 15.0      # stop listening if nobody starts talking
max_record_s = 60.0             # longest single recording

[audio]
input_device = ""               # device index or name substring ("" = system default); see `./myvoice.py devices`
output_device = ""
sample_rate = 16000             # rate fed to VAD/ASR (mic is resampled if it cannot capture at 16 kHz)
block_ms = 32
# With speakers the microphone hears the translation, so auto mode pauses the mic while a
# translation is spoken. With headphones set it to false (or use --headphones) to keep listening.
half_duplex = true
playback_tail_ms = 300          # keep the mic paused a little after playback (room echo)

[vad]
backend = "silero"              # "silero" (bundled with the silero-vad pip package) | "energy"
threshold = 0.5                 # speech probability needed to start/continue speech
min_speech_ms = 250             # shorter blips are ignored
min_silence_ms = 700            # this much silence ends an utterance (lower = snappier, but may cut sentences)
pre_roll_ms = 300               # audio kept from before speech onset
max_utterance_s = 25.0          # force a cut on very long monologues
energy_threshold_db = -42.0     # only used by the "energy" backend

[asr]
model = "models/whisper/faster-whisper-large-v3-turbo"
device = "cuda"
compute_type = "float16"        # "int8_float16" saves ~0.7 GB VRAM at a small accuracy cost
beam_size = 5
initial_prompt = ""             # optional vocabulary/style hint (names, jargon)
filter_hallucinations = true    # drop Whisper's classic phantom phrases ("Sottotitoli a cura di ...")

[translation]
backend = "llama_cpp"           # "llama_cpp" (GGUF, recommended) | "transformers" (HF safetensors)
model = "models/llm/translategemma-4b-it.Q6_K.gguf"
# "translategemma": Google's official TranslateGemma prompt (use with TranslateGemma models)
# "chat"          : interpreter system prompt via the model's chat template (Qwen, Gemma 4, Llama, ...)
prompt_style = "translategemma"
n_gpu_layers = -1               # -1 = whole model on GPU
n_ctx = 2048
flash_attn = true
max_new_tokens = 384
temperature = 0.0               # greedy decoding: deterministic, best for translation
context_turns = 2               # "chat" style only: previous exchanges passed as context
# transformers backend only:
load_in_4bit = true             # bitsandbytes NF4; needed for >=4B models on 8 GB
dtype = "bfloat16"

[tts]
# A voice is a Piper voice name (e.g. "it_IT-paola-medium", found under piper_dir) or a Kokoro
# voice "kokoro:<name>" (e.g. "kokoro:im_nicola"). `./myvoice.py voices` lists the installed ones;
# key V in the app switches voices and remembers the choice.
use_cuda = false                # Piper is faster than real time on CPU; true needs onnxruntime-gpu
length_scale = 1.0              # >1 = slower speech (both engines)
volume = 1.0
sentence_silence_ms = 150       # pause between sentences
piper_dir = "models/piper"
kokoro_model = "models/kokoro/kokoro-v1.0.onnx"
kokoro_voices = "models/kokoro/voices-v1.0.bin"

[tts.voices]
# Male Kokoro voices by default (female: "kokoro:if_sara", "kokoro:af_heart"). Kokoro was the most
# intelligible in a Whisper round-trip test (see README); the Piper voices (e.g. "it_IT-paola-medium",
# "en_US-ryan-high") are lighter and work without Kokoro.
it = "kokoro:im_nicola"
en = "kokoro:am_michael"
